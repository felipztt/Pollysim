<meta name="theme-color" content="#0E3C42">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#EEF8F8;--card:#fff;--ink:#0B2F34;--mut:#4F6F73;--pri:#5da9b3;--lt:#a1f6f7;--dk:#0E3C42;--line:#CFE5E6;--ok:#1B8A5A;--bad:#B8433A;--xp:#E9A82A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A2226;--card:#10353A;--ink:#E4F4F4;--mut:#93B9BC;--line:#1F4A50}}
:root[data-theme="dark"]{--bg:#0A2226;--card:#10353A;--ink:#E4F4F4;--mut:#93B9BC;--line:#1F4A50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;line-height:1.2;margin:0}
header{background:var(--dk);padding:12px 16px}header img{height:46px;display:block;margin:0 auto}
main{max-width:560px;margin:0 auto;padding:16px}
.hero{background:var(--dk);color:#fff;margin:-16px -16px 16px;padding:28px 20px 32px}
.hero h1{font-size:28px;color:#fff}.hero p{color:#CDEBEC;margin:10px 0 0}.hero b{color:var(--lt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:inherit;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--xp);outline-offset:2px}
.err{color:var(--bad);font-size:14px;min-height:18px}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:14px 16px;background:var(--lt);color:#06262B;display:block;width:100%;text-align:center;text-decoration:none}
button.s{background:var(--pri);color:#06262B}button.g{background:transparent;border:1.5px solid var(--pri);color:var(--ink)}button:hover,.btn:hover{filter:brightness(.95)}button:disabled{opacity:.55}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin-top:14px;color:var(--mut)}.chk input{margin-top:3px;width:20px;height:20px;accent-color:#2E8792}
.lnk{background:none;border:0;padding:0;display:inline;width:auto;color:var(--ink);text-decoration:underline;font-weight:600;font-size:14px}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);transition:width .6s}.bar.x i{background:var(--xp)}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:14px}
.tag{font-size:12px;background:var(--line);border-radius:8px;padding:2px 9px;font-weight:600}
.sp3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sp3 div{text-align:center;font-size:13px;color:var(--mut)}.sp3 b{display:block;font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.an{background:var(--card);border:1.5px solid var(--line);color:var(--ink);text-align:left;padding:12px;font-weight:600;font-size:15px}.an span{font-size:28px;display:block}.an.d{border-color:var(--ok)}
.opt{background:var(--card);border:1.5px solid var(--line);color:var(--ink);text-align:left;margin-bottom:9px;font-weight:600}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.pet{font-size:64px;text-align:center;line-height:1}.pet.b{animation:b .5s}@keyframes b{50%{transform:translateY(-12px)}}
@media(prefers-reduced-motion:reduce){.pet.b{animation:none}.bar i{transition:none}}
.fb{border-left:5px solid var(--pri);background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}.modal>div{background:var(--card);max-width:560px;width:100%;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px}.modal h3{margin-top:14px;font-size:16px}.modal p{font-size:14px;margin:4px 0}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--xp);color:#2a1a00;padding:10px 16px;border-radius:12px;font-weight:700;z-index:10;max-width:90%}
footer{max-width:560px;margin:0 auto;padding:8px 16px 32px;color:var(--mut);font-size:12px;text-align:center}
.hp{position:absolute;left:-9999px}
</style></head><body>

 const p={_subject:'Novo lead PollySim — '+L.nome,_template:'table',_captcha:'false',nome:L.nome,email:L.email,telefone:L.tel,consentimento_LGPD:'Sim, em '+L.consent,origem:'PollySim (demonstração)',...extra};

function policy(){$('md').innerHTML=`<div class="modal" onclick="if(event.target==this)this.remove()"><div role="dialog" aria-modal="true" aria-label="Política de privacidade"><h2>Política de Privacidade e Uso de Dados</h2><p class="mut">Modelo informativo em conformidade com a Lei nº 13.709/2018 (LGPD). Recomenda-se revisão jurídica antes da publicação oficial.</p>
<h3>Quem é o controlador</h3><p>Clínica Polly Ensino em Veterinária (PollyPet). Contato do encarregado: ${CFG.mail}.</p>
<h3>Quais dados coletamos</h3><p>Nome, e-mail e telefone informados por você, além do seu desempenho nos desafios do PollySim (acertos, pontuação e competências).</p>
<h3>Para que usamos</h3><p>Identificar você no treinamento, enviar informações sobre o curso de Auxiliar Veterinário e entrar em contato, por e-mail, telefone ou WhatsApp, caso você demonstre interesse.</p>
<h3>Base legal</h3><p>Seu consentimento (art. 7º, I, da LGPD), dado de forma livre e específica ao marcar a caixa do formulário.</p>
<h3>Compartilhamento e armazenamento</h3><p>Seus dados são recebidos pela equipe da Polly por e-mail e não são vendidos. Podem ser tratados por prestadores de serviço necessários ao envio e à guarda das informações. Serão mantidos enquanto durar a finalidade ou até você pedir a exclusão.</p>
<h3>Seus direitos (art. 18)</h3><p>Você pode solicitar confirmação de tratamento, acesso, correção, anonimização, portabilidade, eliminação dos dados e revogação do consentimento a qualquer momento, pelo e-mail ${CFG.mail}.</p>
<p style="margin-top:14px"><button onclick="document.querySelector('.modal').remove()">Entendi</button></p></div></div>`}
function pageLead(){return `<section class="hero"><h1>Você tem olho de <b>auxiliar veterinário</b>?</h1><p>Enfrente casos reais simulados, descubra suas competências e veja como seria sua rotina na clínica. Leva cerca de 3 minutos por paciente.</p></section>
<form class="card" id="f" novalidate><h2 style="font-size:20px">Comece seu treinamento</h2><p class="mut">Informe seus dados para salvar sua pontuação e seu perfil de competências. Você começa com 20 XP de bônus.</p>
<label for="n">Nome</label><input id="n" type="text" autocomplete="name" required><label for="e">E-mail</label><input id="e" type="email" autocomplete="email" inputmode="email" required><label for="t">Telefone (com DDD)</label><input id="t" type="tel" autocomplete="tel-national" inputmode="tel" placeholder="(11) 90000-0000" required>
<input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="chk"><input type="checkbox" id="c"><span>Li e concordo com a <button type="button" class="lnk" onclick="policy()">Política de Privacidade</button> e autorizo a Polly Ensino em Veterinária a usar meus dados para contato sobre o curso, conforme a LGPD. Posso revogar quando quiser.</span></label>
<div class="err" id="er" role="alert"></div><button type="submit">Começar treinamento</button></form>
<div class="card"><h3>Como funciona</h3><p class="mut">1. Escolha um paciente. 2. Observe o caso e decida o que fazer. 3. Receba feedback na hora e acompanhe suas competências.</p></div>`}
function bindLead(){const t=$('t');const fmt=()=>{let d=t.value.replace(/\D/g,'').replace(/^0+/,'');if(d.length>11&&d.startsWith('55'))d=d.slice(2);d=d.slice(0,11);t.value=d.length>10?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length>6?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d};t.oninput=fmt;t.onchange=fmt;
 $('f').onsubmit=async ev=>{ev.preventDefault();if($('hp').value)return;fmt();const n=$('n').value.trim(),e=$('e').value.trim(),tl=t.value,dg=tl.replace(/\D/g,''),er=$('er');
 if(n.length<2)return er.textContent='Informe seu nome.';if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return er.textContent='Informe um e-mail válido.';if(dg.length<10)return er.textContent='Informe o telefone com DDD.';if(!$('c').checked)return er.textContent='Para continuar, aceite a Política de Privacidade.';
 G.lead={nome:n,email:e,tel:tl,consent:new Date().toLocaleString('pt-BR')};G.sent=await sendLead({etapa:'Cadastro'});save();scr='pick';render()}}
const first=()=>G.lead.nome.split(' ')[0];
function head(){const l=lvl(),n=LV[l+1],p=LV[l][1],pc=n?(G.xp-p)/(n[1]-p)*100:100;return `<div class="card"><div class="row sp"><div><h2 style="font-size:20px">Olá, ${esc(first())}</h2><span class="mut">Seu treinamento continua.</span></div><span class="tag">Nível ${l+1}</span></div><p class="mut" style="margin:10px 0 4px">${LV[l][0]} · ${G.xp} XP${n?' · faltam '+(n[1]-G.xp)+' para '+n[0]:''}</p><div class="bar x"><i style="width:${pc}%"></i></div></div>`}
function pagePick(){const tot=SEED.species.length;return head()+`<div class="card"><div class="row sp"><b>Hospital Escola</b><span class="mut">${G.done.length}/${tot} pacientes atendidos</span></div><div class="bar" style="margin-top:8px"><i style="width:${G.done.length/tot*100}%"></i></div></div><h3 style="margin:16px 0 8px">Escolha seu paciente</h3>`+SEED.categories.map(c=>`<p class="mut" style="margin:14px 0 6px"><b>${c.name}</b></p><div class="grid">${SEED.species.filter(s=>s.category_id==c.id).map(s=>`<button class="an ${G.done.includes(s.id)?'d':''}" onclick="startQ('${s.id}')"><span>${s.emoji}</span>${s.name}${G.done.includes(s.id)?' ✓':''}</button>`).join('')}</div>`).join('')+`${G.done.length?`<div class="card" style="margin-top:16px"><b>Seu perfil de competências</b>${compBars(G.comp,5)}<p class="mut" style="margin-top:10px">Atenda mais pacientes para completar seu perfil.</p></div>`:''}
<div class="card"><b>Gostou do treinamento?</b><p class="mut">Nas aulas práticas você faz isso com animais reais e acompanhamento de professores.</p><button class="s" onclick="interest()">Quero conhecer o curso</button></div>`}
function compBars(c,n){const e=Object.entries(c).map(([k,v])=>[k,Math.min(100,Math.round(v[0]/v[1]*100))]).sort((a,b)=>b[1]-a[1]).slice(0,n);return e.map(([k,v])=>`<div style="margin-top:10px"><div class="row sp mut"><span>${CN[k]}</span><span>${v}%</span></div><div class="bar"><i style="width:${v}%"></i></div></div>`).join('')}
const DIFF={EASY:0,MEDIUM:1,HARD:2},sh=a=>[...a].sort(()=>Math.random()-.5);
function startQ(id){const sp=SEED.species.find(s=>s.id==id);const qs=SEED.events.filter(e=>e.species_id==id).sort((a,b)=>DIFF[a.difficulty]-DIFF[b.difficulty]);Q={sp,qs,i:0,ok:0,xp:0,streak:0,cp:{},ans:false};scr='quiz';render()}
function pageQ(){const q=Q.qs[Q.i],o=sh(q.options);Q.opts=o;const pc=Q.i/Q.qs.length*100;
 return `<div class="card"><div class="row sp mut"><span>${Q.sp.emoji} ${Q.sp.name}</span><span>Caso ${Q.i+1} de ${Q.qs.length}</span></div><div class="bar" style="margin:8px 0 14px"><i style="width:${pc+100/Q.qs.length/2}%"></i></div>
 <div class="pet" id="pt" aria-hidden="true">${Q.sp.emoji}</div><h2 style="font-size:19px;margin:12px 0 6px">${esc(q.title)}</h2><p>${esc(q.scenario)}</p>${q.observations.length?`<ul class="mut">${q.observations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 <h3 style="font-size:16px;margin:14px 0 10px">${esc(q.question)}</h3>${o.map((x,i)=>`<button class="opt" onclick="ans(${i})">${'ABCD'[i]}. ${esc(x.text)}</button>`).join('')}<div id="fb"></div></div>`}
function ans(i){if(Q.ans)return;Q.ans=true;const q=Q.qs[Q.i],o=Q.opts[i],r=o.id==q.correct_option_id;
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(Q.opts[j].id==q.correct_option_id)b.classList.add('ok');else if(j==i)b.classList.add('no')});
 let gain=r?q.xp:Math.round(q.xp*.3);if(r){Q.ok++;Q.streak++;if(Q.streak>=3){gain+=20;toast('🔥 Sequência de '+Q.streak+'! +20 XP')}}else Q.streak=0;
 Q.xp+=gain;const a=lvl();G.xp+=gain;if(lvl()>a)toast('⬆️ Nível '+(lvl()+1)+': '+LV[lvl()][0]);
 q.competencies.forEach(c=>{Q.cp[c]=Q.cp[c]||[0,0];Q.cp[c][1]+=q.xp;if(r)Q.cp[c][0]+=q.xp});
 $('pt').textContent=r?'😄':'🤔';$('pt').classList.add('b');
 $('fb').innerHTML=`<div class="fb"><b>${r?'Boa decisão! +'+gain+' XP':'Vamos revisar. +'+gain+' XP pela tentativa'}</b><p style="margin:6px 0">${esc(o.feedback)}</p><p style="margin:6px 0">${esc(r?q.feedback_correct:q.feedback_incorrect)}</p></div><p><button class="s" onclick="nx()">${Q.i+1<Q.qs.length?'Próximo caso':'Ver meu resultado'}</button></p>`;save()}
function nx(){Q.ans=false;Q.i++;if(Q.i>=Q.qs.length)return finish();render()}
async function finish(){if(!G.done.includes(Q.sp.id))G.done.push(Q.sp.id);
 Object.entries(Q.cp).forEach(([k,v])=>{G.comp[k]=G.comp[k]||[0,0];G.comp[k][0]+=v[0];G.comp[k][1]+=v[1]});save();scr='res';render();
 G.sent=await sendLead({etapa:'Treino concluído',paciente:Q.sp.name,acertos:Q.ok+'/'+Q.qs.length,xp_total:G.xp,nivel:LV[lvl()][0],pacientes_atendidos:G.done.length});save()}
function pageRes(){const n=Q.qs.length,p=Q.ok/n,top=Object.entries(Q.cp).map(([k,v])=>[k,v[0]/v[1]]).sort((a,b)=>b[1]-a[1])[0];
 const msg=p>=.8?`${esc(first())}, você mostrou olhar atento de quem nasceu para a rotina veterinária. Imagine isso somado a aulas práticas e professores ao seu lado.`:p>=.5?`Bom começo, ${esc(first())}! Você já pensa como auxiliar. Com prática supervisionada, essas decisões viram segurança.`:`${esc(first())}, errar aqui é parte do treino, e cada feedback te aproxima do profissional que você quer ser. No curso, você pratica com orientação.`;
 const badges=[['🏆','Primeiro Paciente',true],['👁️','Olho de Águia',p>=.8],['⭐','Plantão Perfeito',Q.ok==n]].filter(b=>b[2]);
 return `<section class="hero" style="text-align:center"><div style="font-size:64px">${Q.sp.emoji}</div><h1>${Q.ok} de ${n} decisões adequadas</h1><p>+${Q.xp} XP neste paciente · ${G.xp} XP no total</p></section>
 <div class="card"><p>${msg}</p>${top?`<p class="mut">Sua competência mais forte: <b>${CN[top[0]]}</b>.</p>`:''}</div>
 <div class="card"><b>Conquistas</b>${badges.map(b=>`<div class="row" style="margin-top:8px"><span style="font-size:26px">${b[0]}</span><b>${b[1]}</b></div>`).join('')}</div>
 <div class="card"><b>Suas competências</b>${compBars(Q.cp.x?{}:Object.fromEntries(Object.entries(Q.cp)),6)}</div>
 <div class="card"><b>Pronto para a prática de verdade?</b><p class="mut">Converse com nossa equipe sobre o curso de Auxiliar Veterinário da Polly.</p><button onclick="interest()">Quero conhecer o curso</button><p style="margin:10px 0 0"><button class="g" onclick="scr='pick';render()">Atender outro paciente (${G.done.length}/${SEED.species.length})</button></p></div>`}
async function interest(){const w=window.open(WA,'_blank','noopener');G.interest=true;save();const ok=await sendLead({etapa:'INTERESSE NO CURSO (abriu WhatsApp)',xp_total:G.xp,pacientes_atendidos:G.done.length,nivel:LV[lvl()][0]});G.sent=ok;save();
 $('md').innerHTML=`<div class="modal" onclick="if(event.target==this)this.remove()"><div><h2>Falta só uma mensagem! 🎉</h2><p>Obrigado, ${esc(first())}. ${w?'Abrimos o WhatsApp da Polly para você.':'Toque abaixo para falar com a Polly no WhatsApp.'}</p><p><a class="btn" href="${WA}" target="_blank" rel="noopener">Abrir WhatsApp</a></p>${ok?'':`<p class="mut">Se preferir, envie seus dados por e-mail:</p><p><a class="btn" style="background:var(--pri)" href="${mailto('Interesse no curso: SIM\nXP: '+G.xp+'\nPacientes atendidos: '+G.done.length)}">Enviar por e-mail</a></p>`}<p><button class="g" onclick="document.querySelector('.modal').remove()">Fechar</button></p></div></div>`}
function render(){const a=$('app');a.innerHTML=scr=='lead'?pageLead():scr=='pick'?pagePick():scr=='quiz'?pageQ():pageRes();if(scr=='lead')bindLead();window.scrollTo(0,0)}
render();
</script></body></html>
